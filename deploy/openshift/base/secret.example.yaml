# Template only, not applied by kustomize: credentials never land in git.
# The MySQL login for the existing ocp_connect schema, shared by catalog-, question- and exam-service.
# Create it once per project:
#   oc create secret generic saas-exam-mysql \
#     --from-literal=SPRING_DATASOURCE_USERNAME=<user> --from-literal=SPRING_DATASOURCE_PASSWORD=<password>
apiVersion: v1
kind: Secret
metadata:
  name: saas-exam-mysql
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: <user>
  SPRING_DATASOURCE_PASSWORD: <password>
