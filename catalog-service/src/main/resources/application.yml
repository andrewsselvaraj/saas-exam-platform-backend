server:
  port: ${PORT:8081}

spring:
  application:
    name: catalog-service
  datasource:
    # File-based H2 so data survives restarts. Delete ./data/catalogdb* to reset to the seed data.
    url: ${DB_URL:jdbc:h2:file:./data/catalogdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

services:
  question:
    url: ${QUESTION_SERVICE_URL:http://localhost:8082}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Show each component (db, diskSpace, ...) and its details, not just the overall status.
      show-details: always
      # /actuator/health/liveness and /actuator/health/readiness for the OpenShift probes.
      probes:
        enabled: true
      group:
        # Not ready while the database is unreachable, so OpenShift stops sending traffic instead of restarting.
        readiness:
          include: readinessState,db
