server:
  port: 8080

spring:
  application:
    name: saas-exam-platform-backend
  datasource:
    # File-based H2 so data survives restarts. Delete ./data to reset to the seed data.
    url: jdbc:h2:file:./data/examdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html
