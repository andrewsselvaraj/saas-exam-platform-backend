apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# One directory per microservice of saas-exam-platform-backend.
# Only api-gateway gets a Route; the other services are reachable inside the cluster only.
resources:
  - api-gateway
  - catalog-service
  - question-service
  - exam-service
  # SSH tunnel image used by the data services' sidecar to reach MySQL.
  - mysql-tunnel

labels:
  - pairs:
      app.kubernetes.io/part-of: saas-exam-platform
