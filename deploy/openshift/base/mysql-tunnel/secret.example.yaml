# Template only, not applied by kustomize: credentials never land in git.
# SSH key the tunnel sidecars use to reach the MySQL server, and the server's pinned host key.
#   ssh-keygen -t ed25519 -N "" -f id_ed25519
#   ssh-keyscan -t ed25519 <db-server> > known_hosts      (check the fingerprint with ssh-keygen -lf known_hosts)
#   oc create secret generic mysql-ssh-tunnel --from-file=id_ed25519 --from-file=known_hosts
# On the server, id_ed25519.pub goes into ~ocp-tunnel/.ssh/authorized_keys as:
#   restrict,port-forwarding,permitopen="127.0.0.1:3306" ssh-ed25519 AAAA... ocp-tunnel
apiVersion: v1
kind: Secret
metadata:
  name: mysql-ssh-tunnel
type: Opaque
stringData:
  id_ed25519: <private key>
  known_hosts: <server host key line>
