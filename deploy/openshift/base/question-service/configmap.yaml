# Overrides for question-service's application.yml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: question-service-config
data:
  PORT: "8082"
  # The existing MySQL schema, reached through the pod's SSH tunnel sidecar (127.0.0.1:3306 -> the
  # database server's own MySQL), so the SSH session already encrypts it. Login: saas-exam-mysql Secret.
  # Connect only, never create anything in it:
  #   createDatabaseIfNotExist=false  fail instead of creating a missing database
  #   SPRING_FLYWAY_ENABLED=false      no migrations, no tables, no seed data
  #   ddl-auto=validate                Hibernate only checks the existing tables
  DB_URL: "jdbc:mysql://127.0.0.1:3306/ocp_connect?createDatabaseIfNotExist=false&sslMode=PREFERRED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC"
  SPRING_FLYWAY_ENABLED: "false"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  SERVER_SHUTDOWN: "graceful"
  # Turns on /actuator/health/liveness and /readiness used by the probes.
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  JAVA_MAX_RAM_RATIO: "75"
  CATALOG_SERVICE_URL: "http://catalog-service:8081"
